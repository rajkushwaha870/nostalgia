  <circle cx="32" cy="32" r="26" stroke="#F1D7A3" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Outer Radio Dial Frame -->
  <rect x="14" y="20" width="36" height="26" rx="4" fill="#3A2116" stroke="#F1D7A3" stroke-width="1.5" />
  
  <!-- Antenna -->
  <line x1="22" y1="20" x2="16" y2="10" stroke="#F1D7A3" stroke-width="2" stroke-linecap="round" />
  <circle cx="16" cy="10" r="1.5" fill="#E5AD54" />
  
  <!-- Radio Speaker Grille -->
  <rect x="18" y="24" width="16" height="18" rx="2" fill="#24150F" stroke="#C88A3D" stroke-width="0.8" />
  <line x1="20" y1="27" x2="32" y2="27" stroke="#E5AD54" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="30" x2="32" y2="30" stroke="#E5AD54" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="33" x2="32" y2="33" stroke="#E5AD54" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="36" x2="32" y2="36" stroke="#E5AD54" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="20" y1="39" x2="32" y2="39" stroke="#E5AD54" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  
  <!-- Radio Dial Knobs -->
  <circle cx="41" cy="27" r="3" fill="#E5AD54" stroke="#24150F" stroke-width="1" />
  <circle cx="41" cy="36" r="3" fill="#C94B32" stroke="#F1D7A3" stroke-width="1" />
  
  <!-- Musical Note Accent Floating Up -->
  <path d="M44 14 C 44 12, 48 10, 48 13 V 18 C 48 19.5, 46.5 21, 45 21 C 43.5 21, 42.5 19.8, 42.5 18.5 C 42.5 17.2, 43.5 16, 45 16 C 45.8 16, 46.5 16.3, 47 16.8 V 14.5 Z" fill="#F1D7A3" />
