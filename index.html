<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOSTALGIA — Indian Vintage Music</title>
    <!-- Google Fonts for Vintage Indian Poster & Hand-Painted Shopboard Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Kalam:wght@400;700&family=Outfit:wght@300;400;500;600;700&family=Rozha+One&family=Sacramento&family=Satisfy&family=Yatra+One&family=Yellowtail&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#24150F] text-[#F1D7A3] selection:bg-[#B9472F] selection:text-[#F1D7A3] overflow-x-hidden min-h-screen">
    <!-- Hidden SVG Filters for Hand-Painted Distressed Effects -->
    <svg width="0" height="0" className="absolute pointer-events-none hidden" aria-hidden="true">
      <defs>
        <filter id="distressed-paint" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        </filter>
        <filter id="subtle-paint-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
