<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <title>NOSTALGIA — Some Songs Take You Back</title>
    <meta name="description" content="NOSTALGIA is an immersive Indian music experience inspired by old radios, village evenings, childhood memories and timeless songs." />
    <meta name="keywords" content="Nostalgia, Indian music, vintage radio, retro songs, classic melodies, childhood memories, village tea stall, Hindi music player" />
    <meta name="theme-color" content="#24150F" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NOSTALGIA — Some Songs Take You Back" />
    <meta property="og:description" content="An immersive Indian music experience inspired by old radios, village evenings, childhood memories and timeless songs." />
    <meta property="og:image" content="/hero-bg.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NOSTALGIA — Some Songs Take You Back" />
    <meta name="twitter:description" content="An immersive Indian music experience inspired by old radios, village evenings, childhood memories and timeless songs." />
    <meta name="twitter:image" content="/hero-bg.png" />

    <!-- Google Fonts for Vintage Indian Signboard & Hand-Painted Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Gajraj+One&family=Hind:wght@400;500;600;700&family=Kaushan+Script&family=Outfit:wght@300;400;500;600;700&family=Rozha+One&family=Satisfy&family=Teko:wght@500;600;700&family=Yatra+One&family=Yellowtail&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#24150F] text-[#F1D7A3] selection:bg-[#B9472F] selection:text-[#F1D7A3] overflow-x-hidden min-h-screen">
    <!-- Hidden SVG Filters for Hand-Painted Distressed Effects -->
    <svg width="0" height="0" class="absolute pointer-events-none hidden" aria-hidden="true">
      <defs>
        <filter id="distressed-paint" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        </filter>
        <filter id="subtle-paint-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
